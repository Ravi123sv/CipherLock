name: CI (API)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install pnpm
        run: |
          npm i -g pnpm@9.15.0
          pnpm --version

      - name: Install
        run: pnpm install --frozen-lockfile




      - name: Typecheck api-server
        working-directory: artifacts/api-server
        run: pnpm run typecheck

      - name: Build api-server
        working-directory: artifacts/api-server
        run: pnpm run build

