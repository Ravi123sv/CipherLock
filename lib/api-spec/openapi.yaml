openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CipherLock - Hybrid AES-RSA Encryption API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: keys
  - name: files
  - name: rooms

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /keys/generate:
    post:
      operationId: generateKeyPair
      tags: [keys]
      summary: Generate RSA key pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyPairInput"
      responses:
        "201":
          description: Key pair generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPairResult"

  /keys:
    get:
      operationId: listKeyPairs
      tags: [keys]
      summary: List stored key pairs
      responses:
        "200":
          description: List of key pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KeyPairMeta"

  /keys/{id}:
    get:
      operationId: getKeyPair
      tags: [keys]
      summary: Get a key pair by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Key pair detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPairResult"
        "404":
          description: Not found
    delete:
      operationId: deleteKeyPair
      tags: [keys]
      summary: Delete a key pair
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /files/encrypt:
    post:
      operationId: encryptFile
      tags: [files]
      summary: Encrypt a file with hybrid AES-RSA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EncryptInput"
      responses:
        "200":
          description: Encrypted bundle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EncryptResult"

  /files/decrypt:
    post:
      operationId: decryptFile
      tags: [files]
      summary: Decrypt an encrypted file bundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecryptInput"
      responses:
        "200":
          description: Decrypted file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecryptResult"

  /files:
    get:
      operationId: listFileOperations
      tags: [files]
      summary: List recent file operations
      responses:
        "200":
          description: File operation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileOperation"

  /files/stats:
    get:
      operationId: getFileStats
      tags: [files]
      summary: Get file operation statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStats"

  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a transfer room and get a pairing code
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"

  /rooms/{code}:
    get:
      operationId: getRoomStatus
      tags: [rooms]
      summary: Get room status
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
    delete:
      operationId: closeRoom
      tags: [rooms]
      summary: Close a room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Closed

  /rooms/{code}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join an existing room as the second device
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
        "409":
          description: Room already full

  /rooms/{code}/files:
    post:
      operationId: sendRoomFile
      tags: [rooms]
      summary: Upload an encrypted file to a room for the peer to receive
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomFileInput"
      responses:
        "201":
          description: File staged for transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomFile"
    get:
      operationId: listRoomFiles
      tags: [rooms]
      summary: List files pending in a room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pending files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomFile"

  /rooms/{code}/files/{fileId}:
    get:
      operationId: downloadRoomFile
      tags: [rooms]
      summary: Download a specific file from a room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomFile"
        "404":
          description: File not found
    delete:
      operationId: acknowledgeRoomFile
      tags: [rooms]
      summary: Acknowledge receipt and remove a file from the room
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Acknowledged

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    KeyPairInput:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
        keySize:
          type: integer
          default: 2048

    KeyPairMeta:
      type: object
      required: [id, label, keySize, fingerprint, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        keySize:
          type: integer
        fingerprint:
          type: string
        createdAt:
          type: string

    KeyPairResult:
      type: object
      required: [id, label, keySize, fingerprint, publicKey, privateKey, createdAt]
      properties:
        id:
          type: integer
        label:
          type: string
        keySize:
          type: integer
        fingerprint:
          type: string
        publicKey:
          type: string
        privateKey:
          type: string
        createdAt:
          type: string

    EncryptInput:
      type: object
      required: [fileName, fileData, publicKey]
      properties:
        fileName:
          type: string
        fileData:
          type: string
        publicKey:
          type: string
        keyId:
          type: ["integer", "null"]

    EncryptResult:
      type: object
      required: [fileName, encryptedAesKey, iv, authTag, ciphertext, algorithm, createdAt]
      properties:
        id:
          type: integer
        fileName:
          type: string
        encryptedAesKey:
          type: string
        iv:
          type: string
        authTag:
          type: string
        ciphertext:
          type: string
        algorithm:
          type: string
        createdAt:
          type: string

    DecryptInput:
      type: object
      required: [encryptedAesKey, iv, authTag, ciphertext, privateKey]
      properties:
        encryptedAesKey:
          type: string
        iv:
          type: string
        authTag:
          type: string
        ciphertext:
          type: string
        privateKey:
          type: string
        fileName:
          type: string

    DecryptResult:
      type: object
      required: [fileName, fileData, algorithm]
      properties:
        fileName:
          type: string
        fileData:
          type: string
        algorithm:
          type: string
        decryptedAt:
          type: string

    FileOperation:
      type: object
      required: [id, type, fileName, algorithm, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        fileName:
          type: string
        algorithm:
          type: string
        keyId:
          type: ["integer", "null"]
        keyLabel:
          type: ["string", "null"]
        createdAt:
          type: string

    FileStats:
      type: object
      required: [totalOperations, totalEncryptions, totalDecryptions, recentActivity]
      properties:
        totalOperations:
          type: integer
        totalEncryptions:
          type: integer
        totalDecryptions:
          type: integer
        totalKeyPairs:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/FileOperation"

    Room:
      type: object
      required: [code, status, createdAt]
      properties:
        code:
          type: string
        status:
          type: string
          description: "waiting | connected | closed"
        peerCount:
          type: integer
        createdAt:
          type: string
        expiresAt:
          type: string

    RoomFileInput:
      type: object
      required: [fileName, encryptedAesKey, iv, authTag, ciphertext, senderPublicKey]
      properties:
        fileName:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        encryptedAesKey:
          type: string
        iv:
          type: string
        authTag:
          type: string
        ciphertext:
          type: string
        senderPublicKey:
          type: string
          description: PEM public key of the sender for verification

    RoomFile:
      type: object
      required: [id, roomCode, fileName, encryptedAesKey, iv, authTag, ciphertext, senderPublicKey, createdAt]
      properties:
        id:
          type: integer
        roomCode:
          type: string
        fileName:
          type: string
        fileSize:
          type: ["integer", "null"]
        mimeType:
          type: ["string", "null"]
        encryptedAesKey:
          type: string
        iv:
          type: string
        authTag:
          type: string
        ciphertext:
          type: string
        senderPublicKey:
          type: string
        downloadedAt:
          type: ["string", "null"]
        createdAt:
          type: string
