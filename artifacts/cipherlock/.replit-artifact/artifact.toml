kind = "web"
previewPath = "/"
title = "CipherLock"
version = "1.0.0"
id = "artifacts/cipherlock"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26115

[services.development]
run = "pnpm --filter @workspace/cipherlock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cipherlock", "run", "build" ]
publicDir = "artifacts/cipherlock/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26115"
BASE_PATH = "/"
